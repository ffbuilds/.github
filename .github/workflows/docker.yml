---
name: Create and publish a Docker image

on:
  workflow_call:
    inputs:
      # bump: alpine /default: ([\d.]+) # stable/ docker:alpine|^3
      # bump: alpine link "Release notes" https://alpinelinux.org/posts/Alpine-$LATEST-released.html
      alpine_stable:
        type: string
        description: The current stable alpine version
        default: 3.24.1 # stable
        required: false
      push_images:
        type: boolean
        description: Push images, create releases, and cascade FFmpeg rebuilds
        default: false
        required: false
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        alpine_version:
          - ${{ inputs.alpine_stable }}
          - edge
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
          - linux/arm/v6
        include:
          - platform: linux/amd64
            name: amd64
          - platform: linux/arm64
            name: arm64
          - platform: linux/arm/v7
            name: arm_v7
          - platform: linux/arm/v6
            name: arm_v6

    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-packages: write

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ steps.generate-token.outputs.token }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-alpine_${{ matrix.alpine_version }}
          flavor: |
            suffix=-${{ matrix.name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            ALPINE_VERSION=${{ matrix.alpine_version }}
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.push_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}-alpine-${{ matrix.alpine_version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-alpine-${{ matrix.alpine_version }}
          provenance: false

  ci-success:
    if: always()
    needs: [build-and-push-image]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm image builds succeeded
        run: |
          test "${{ needs.build-and-push-image.result }}" = "success"


  build-and-push-manifest:
    if: inputs.push_images
    needs: [build-and-push-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        alpine_version:
          - ${{ inputs.alpine_stable }}
          - edge

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-alpine_${{ matrix.alpine_version }}

      - name: Create and push manifest
        run: |
          TAGS=(${{ steps.meta.outputs.tags }})
          for TAG in "${TAGS[@]}"; do
            docker manifest create ${TAG} \
              ${TAG}-amd64 \
              ${TAG}-arm64 \
              ${TAG}-arm_v7 \
              ${TAG}-arm_v6
            docker manifest push ${TAG}
          done

  github-release:
    if: inputs.push_images
    needs: [build-and-push-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-packages: read

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve version and create GitHub Release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          ALPINE_STABLE: ${{ inputs.alpine_stable }}
        run: |
          set -euo pipefail
          VERSION="$(
            grep -E '^ARG [A-Z0-9_]+_(VERSION|COMMIT)=' Dockerfile \
              | grep -v ALPINE \
              | grep -v '=main' \
              | head -1 \
              | sed -E 's/^[^=]+=//'
          )"
          if [ -z "$VERSION" ]; then
            echo "No version ARG found; skipping release"
            exit 0
          fi
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi

          REPO="${GITHUB_REPOSITORY}"
          ASSETS=()
          case "$REPO" in
            ffbuilds/static-ffmpeg-gplv3|ffbuilds/static-ffmpeg-minimal)
              echo "${{ steps.generate-token.outputs.token }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
              IMAGE="${REGISTRY}/${REPO}-alpine_${ALPINE_STABLE}:main"
              docker pull "$IMAGE"
              CID="$(docker create "$IMAGE")"
              docker cp "$CID:/ffmpeg" "./ffmpeg"
              docker cp "$CID:/ffprobe" "./ffprobe"
              docker rm "$CID"
              chmod +x ffmpeg ffprobe
              ASSETS+=(ffmpeg ffprobe)
              ;;
          esac

          gh release create "$TAG" "${ASSETS[@]}" \
            --title "$TAG" \
            --generate-notes

  cascade-ffmpeg:
    if: >-
      inputs.push_images &&
      github.repository != 'ffbuilds/static-ffmpeg-gplv3' &&
      github.repository != 'ffbuilds/static-ffmpeg-minimal'
    needs: [build-and-push-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ffbuilds
          permission-contents: write
          permission-actions: write

      - name: Dispatch FFmpeg rebuilds
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          for repo in static-ffmpeg-gplv3 static-ffmpeg-minimal; do
            gh api "repos/ffbuilds/${repo}/dispatches" -f event_type=rebuild
          done
